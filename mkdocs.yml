site_name: drugMR
site_description: Multi-omics pipeline for genetically anchored drug target discovery
site_url: https://guillermocomesanacimadevila.github.io/drugMR/
repo_url: https://github.com/guillermocomesanacimadevila/drugMR

nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started.md
      - Configure a run: configuration.md
      - Run the pipeline: running.md
  - Results and dashboard: results-dashboard.md
  - Output schema: RESULTS_SCHEMA.md
  - Troubleshooting: troubleshooting.md

theme:
  name: "readthedocs"
  logo: new_logo.png

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

plugins:
  - search

copyright: Copyright &copy; 2026 drugMR contributors
