site_name: drugMR
site_description: Multi-omics pipeline for genetically anchored drug target discovery
site_url: https://guillermocomesanacimadevila.github.io/drugMR/
repo_url: https://github.com/guillermocomesanacimadevila/drugMR
repo_name: guillermocomesanacimadevila/drugMR

theme:
  name: material
  icon:
    logo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Use light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started.md
      - Configure a run: configuration.md
      - Run the pipeline: running.md
  - Results and dashboard: results-dashboard.md
  - Output schema: RESULTS_SCHEMA.md
  - Troubleshooting: troubleshooting.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/guillermocomesanacimadevila/drugMR

copyright: Copyright &copy; 2026 drugMR contributors
