name: drugMR CI workflow

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  r-syntax:
    name: R script syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Parse every R script
        run: |
          for f in bin/*.R; do
            Rscript -e "parse('$f')" || { echo "::error::$f failed to parse"; exit 1; }
          done