name: drugMR CI workflow

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  nextflow-test:
    name: Run Nextflow test chain 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v1
        with:
          version: "26.04.6"

      - name: Pull drugMR container image
        run: docker pull ghcr.io/guillermocomesanacimadevila/drugmr:latest

      - name: Run toy pipeline chain
        run: |
          nextflow run main.nf \
            -params-file tests/nf/params.qc_test.yaml \
            --manifest_path tests/dat/qtl_manifest_toy.csv

      - name: Check real cis-MR output was produced
        run: |
          MR_TSV=$(find tests/nf/results -path "*cis_mr/mr.tsv" | head -1)
          if [ -z "$MR_TSV" ]; then
            echo "::error::no mr.tsv produced by the toy Nextflow run"
            exit 1
          fi
          grep -q "ANKRD54_Q6NXT1" "$MR_TSV" || {
            echo "::error::expected ANKRD54_Q6NXT1 row missing from $MR_TSV"
            exit 1
          }

      - name: Upload Nextflow logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nextflow-toy-logs
          path: |
            .nextflow.log
            tmp/nf-work