services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: $(POSTGRES_USER)
      POSTGRES_PASSWORD: $(POSTGRES_PASSWORD) # just a random password (if you're seeing this you must know that this pipeline would not be deplpyed anywhere!!!)
      POSTGRES_DB: $(POSTGRES_DB)
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  pgdata:

